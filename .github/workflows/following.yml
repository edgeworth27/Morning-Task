name: Inspect X following list
on:
  workflow_dispatch:
    inputs:
      handle:
        description: 'X username to inspect (read-only; no briefing changes)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Read following list through official X API
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REQUEST_HANDLE: ${{ inputs.handle }}
        run: python following.py "$REQUEST_HANDLE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x-following-list
          path: out/following.json
          retention-days: 7
