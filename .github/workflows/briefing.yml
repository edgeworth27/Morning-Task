name: Daily X intelligence

on:
  schedule:
    # 06:15 EDT and 06:15 EST. Python selects exactly one using zoneinfo.
    - cron: '15 10 * * *'
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      find_chat_id:
        description: 'Setup only: find Telegram chat ID after sending /start to your bot'
        type: boolean
        default: false
      date:
        description: 'Eastern briefing date YYYY-MM-DD (blank = today)'
        type: string
      dry_run:
        description: 'Real retrieval and AI analysis, without delivery'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-x-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4.1-mini' }}
      TOPIC_PAGES: ${{ vars.TOPIC_PAGES || '2' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Unit and integration tests (synthetic fixtures, no live requests)
        run: python -m unittest discover -s tests -v
      - name: Retrieve, summarize, and deliver
        env:
          REQUEST_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          FIND_CHAT_ID: ${{ inputs.find_chat_id }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$FIND_CHAT_ID" == true ]]; then
            python briefing.py --telegram-chat
            exit 0
          fi
          args=()
          if [[ "$EVENT_NAME" == schedule ]]; then
            read -r minute hour rest <<< "$CRON"
            args+=(--schedule-slot "$hour")
          else
            [[ -z "$REQUEST_DATE" ]] || args+=(--date "$REQUEST_DATE")
            [[ "$DRY_RUN" != true ]] || args+=(--dry-run)
          fi
          python briefing.py "${args[@]}"
      - name: Save briefing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briefing-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
